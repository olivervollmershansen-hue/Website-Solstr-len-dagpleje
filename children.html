<!-- Administration af børn -->
<main class="children-admin">

  <h1>Børn i dagplejen</h1>

  <section>
    <h2>Tilføj et barn</h2>

    <form id="childForm">
      <label for="name">Barnets navn:</label>
      <input type="text" id="name" required>

      <label for="startDate">Startdato:</label>
      <input type="date" id="startDate" required>

      <label for="endDate">Slutdato:</label>
      <input type="date" id="endDate" required>

      <button type="submit">Tilføj barn</button>
    </form>
  </section>

  <section>
    <h2>Indskrevne børn</h2>
    <ul id="childrenList"></ul>
  </section>

  <section>
    <h2>Fjern et barn</h2>

    <label for="childToRemove">
      Vælg barn, der skal fjernes:
    </label>

    <select id="childToRemove">
      <option value="">Vælg et barn</option>
    </select>

    <button type="button" id="removeChildButton">
      Fjern barn
    </button>
  </section>

</main>

<script src="children.js"></script>

</body>
